name: Access Control
variables:
  - name: baseUrl
    value: http://127.0.0.1:3000/api/v1
  - name: admin_username
    value: admin
  - secret: true
    name: admin_password
    description: Local admin password
  - name: groupId
    value: "1"
  - name: otherGroupId
    value: "2"
  - name: childId
    value: "1"
  - name: ownChildId
    value: "1"
  - name: adminId
    value: "1"