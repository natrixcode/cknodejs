http:
  method: POST
  url: "{{baseUrl}}/daily-blocks"
  body:
    type: json
    data: |
      {
        "group_id": 1,
        "block_date": "2026-11-24",
        "kind": "meal",
        "start_time": "2026-11-24T12:00:00+02:00",
