info:
  name: 08 - Activate group
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/groups/1/status"
  body:
    type: json
    data: |-
      {
        "status": "active"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
