info:
  name: 05 - Assign educator
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/groups/1/employees"
  body:
    type: json
    data: |-
      {
        "employee_id": 1,
        "role": "educator"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
