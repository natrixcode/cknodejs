info:
  name: 03 - Create educator
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/employees"
  body:
    type: json
    data: |-
      {
        "first_name": "QA",
        "last_name": "Educator",
        "email": "qa.educator@example.test",
        "phone": "380501234501",
        "position": "educator",
        "salary": 40000,
        "status": "active"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
