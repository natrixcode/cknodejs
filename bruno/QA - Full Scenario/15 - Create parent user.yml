info:
  name: 15 - Create parent user
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/users"
  body:
    type: json
    data: |-
      {
        "name": "QA Parent",
        "email": "qa.parent.user@example.test",
        "username": "qa_parent",
        "password": "{{parent_password}}",
        "role": "parent",
        "status": "active",
        "parent_id": 1
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        if (res.getStatus() === 201 && body?.data?.id) {
          bru.setVar('parentUserId', body.data.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
