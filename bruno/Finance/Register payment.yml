info:
  name: Register payment
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:3000/api/v1/payments
  body:
    type: json
    data: |-
      {
        "invoice_id": 1,
        "amount": 5000,
        "method": "card",
        "payment_date": "2026-11-10T18:15:00+02:00",
        "transaction_id": "demo-payment-invoice1-001"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
