info:
  name: Issue monthly invoice
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/v1/invoices
  body:
    type: json
    data: |-
      {
        "child_id": 5,
        "period_start": "2026-12-01",
        "period_end": "2026-12-31",
        "currency": "UAH",
        "parameters": {
          "months": 1,
          "meal_days": 20
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
