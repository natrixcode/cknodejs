info:
  name: Demo Manager Login
  type: http
  seq: 8

http:
  method: POST
  url: http://localhost:3000/api/v1/auth/login
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "demo_manager",
        "password": "{{demo_password}}"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (res.getStatus() === 200 && body?.data?.token) {
          bru.setVar("token", body.data.token);
        }
