info:
  name: List all users
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users?include_inactive=true"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: include_inactive
      value: "true"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
