info:
  name: Mark attendance today
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3000/api/v1/attendance
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "child_id": "{{attendance_child_id}}",
        "date": "{{attendance_date}}",
        "present": true
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Europe/Kyiv",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(new Date());
        const values = Object.fromEntries(
          parts.map(part => [part.type, part.value])
        );
        bru.setVar(
          "attendance_date",
          `${values.year}-${values.month}-${values.day}`
        );
    - type: after-response
      code: |-
        const body = res.getBody();
        if ([200, 201].includes(res.getStatus()) && body?.data?.id) {
          bru.setVar("attendance_id", String(body.data.id));
        }