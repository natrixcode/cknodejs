info:
  name: Group attendance today
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/attendance?group_id=1&date=2026-11-19"
  params:
    - name: group_id
      value: "1"
      type: query
    - name: date
      value: 2026-11-19
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("attendance_date", "2026-11-19");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
