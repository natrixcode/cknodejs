name: CI

on:
  push:
    branches:
      - main
      - feature/github-actions-ci
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Check, Test and PostgreSQL Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_postgres_password
          POSTGRES_DB: kindergarten_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kindergarten_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci_only_postgres_password
      PGDATABASE: kindergarten_ci
      MIGRATION_TEST_ADMIN_DB: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run all tests with PostgreSQL integration enabled
        run: npm test

      - name: Apply real SQL migrations to a clean database
        run: npm run db:migrate

      - name: Verify all 21 required tables and migration history
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { Client } from 'pg';

          const expectedTables = [
            'rooms',
            'groups',
            'children',
            'parents',
            'children_parents',
            'employees',
            'group_staff',
            'subjects',
            'employee_subjects',
            'schedule',
            'meal_prices',
            'discounts',
            'child_discounts',
            'users',
            'food_rates',
            'tuition_rates',
            'invoices',
            'payments',
            'salaries',
            'expenses',
            'settings',
          ];

          const client = new Client();
          await client.connect();

          try {
            const { rows: tableRows } = await client.query(`
              SELECT tablename
              FROM pg_tables
              WHERE schemaname = 'public'
                AND tablename <> 'schema_migrations'
              ORDER BY tablename
            `);
            const actualTables = new Set(tableRows.map((row) => row.tablename));
            const missingTables = expectedTables.filter((name) => !actualTables.has(name));

            assert.deepEqual(missingTables, [], 'Some required business tables are missing');
            console.log(`All ${expectedTables.length} required business tables exist.`);

            const { rows: migrations } = await client.query(`
              SELECT number, filename
              FROM public.schema_migrations
              WHERE number = 1
            `);
            assert.deepEqual(migrations, [{
              number: 1,
              filename: '0001_create_initial_schema.sql',
            }]);
            console.log('Initial migration is recorded correctly.');
          } finally {
            await client.end();
          }
          NODE

      - name: Verify running migrations twice is safe
        run: npm run db:migrate
